<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a New Recipe</title>
  <link rel="stylesheet" href="../YCD/css/addNewRecipe.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Add a New Recipe</h1>
      <img src="../YCD/images/logo.png" alt="Logo" class="logo">
    </header>

    <form id="recipeForm">
      <label>YouTube Video URL</label>
      <input type="url" id="videoUrl" placeholder="Enter YouTube video URL" required>

      <label>Custom Thumbnail</label>
      <input type="file" id="thumbnail" accept="image/*">

      <label>Recipe Title</label>
      <input type="text" id="title" placeholder="Enter Recipe Title" required>

      <label>Description</label>
      <textarea id="description" placeholder="Enter Description" required></textarea>

      <label>Preparation Time (minutes)</label>
      <input type="number" id="prepTime" placeholder="Enter Preparation Time (minutes)" required>

      <label>Price (LKR)</label>
      <input type="text" id="price" placeholder="Enter Price (LKR)" required>

      <label>Delivery Time (minutes)</label>
      <input type="number" id="deliveryTime" placeholder="Enter Delivery Time (minutes)" required>

      <label>Delivery Areas</label>
      <input type="text" id="deliveryAreas" placeholder="Enter Delivery Areas" required>

      <label>Dish Images</label>
      <input type="file" id="dishImage1" accept="image/*">
      <input type="file" id="dishImage2" accept="image/*">
      <input type="file" id="dishImage3" accept="image/*">

      <div class="buttons">
        <button type="button" onclick="previewRecipe()">Preview</button>
        <button type="submit">Publish</button>
      </div>
    </form>

    <div id="previewContainer">
      <h2>Recipe Preview</h2>
      <div id="preview"></div>
    </div>
  </div>

  <script>
    function previewRecipe() {
      const videoUrl = document.getElementById('videoUrl').value;
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const prepTime = document.getElementById('prepTime').value;
      const price = document.getElementById('price').value;
      const deliveryTime = document.getElementById('deliveryTime').value;
      const deliveryAreas = document.getElementById('deliveryAreas').value;
      const dishImage = document.getElementById('dishImage1').files[0];

      const preview = document.getElementById('preview');
      preview.innerHTML = '';

      if (dishImage) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.innerHTML = `
            <div class="card">
              <img src="${e.target.result}" alt="Dish Image">
              <div>
                <strong>${title}</strong><br>
                ${description}<br><br>
                Preparation Time: ${prepTime} mins<br>
                Price: ${price}<br>
                Delivery Time: ${deliveryTime} mins<br>
                Delivery Areas: ${deliveryAreas}<br><br>
                <iframe width="100%" height="200" src="${videoUrl.replace("watch?v=", "embed/")}" frameborder="0" allowfullscreen></iframe>
              </div>
            </div>
          `;
        }
        reader.readAsDataURL(dishImage);
      }
    }
  </script>
</body>
</html>
