<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Cook Delivers - User Type</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../YCD/css/type.css" />
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-dark text-white">
    <div class="row w-100 max-width">
      <!-- Left Section -->
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-start p-4">
        <h3 class="mb-5">I am a ....</h3>

        <div class="option-box mb-4 d-flex align-items-center">
          <div class="icon-circle">
            <img src="../YCD/images/viewer.png" alt="Viewer" />
          </div>
          <div class="option-label ms-3">Viewer</div>
        </div>

        <div class="option-box mb-4 d-flex align-items-center">
          <div class="icon-circle">
            <img src="../YCD/images/creator.png" alt="Recipe Creator" />
          </div>
          <div class="option-label ms-3">Recipe Creator</div>
        </div>

        <div class="option-box mb-5 d-flex align-items-center">
          <div class="icon-circle">
            <img src="../YCD/images/rider.png" alt="Delivery Service" />
          </div>
          <div class="option-label ms-3">Delivery Service</div>
        </div>

        <button class="continue-btn">Continue</button>
        <p class="mt-3 small">already have an account <a href="#" class="text-white fw-bold">Click here.</a></p>
      </div>

      <!-- Right Section -->
      <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center">
        <img src="../YCD/images/type.png" alt="Illustration" class="img-fluid illustration" />
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
