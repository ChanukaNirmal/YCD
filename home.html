<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You Cook Delivers</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="You Cook Logo" />
      <span>You Cook <strong>Delivers</strong></span>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search channel or food item" />
      <button class="clear">×</button>
      <button class="search-btn">🔍</button>
    </div>
    <div class="signup">
      <button>👤 Sign up</button>
    </div>
  </header>

  <main>
    <section class="video-grid">
      <!-- Repeat this block for each video -->
      <div class="video-card">
        <img src="https://img.youtube.com/vi/7RjYIJVSm-0/hqdefault.jpg" alt="Rolls" />
        <div class="video-info">
          <h4>Ramzan Special | Chinese Potato Kabab</h4>
          <p>MR Kitchen • LKR 200.00</p>
        </div>
      </div>

      <div class="video-card">
        <img src="https://img.youtube.com/vi/1u3EMJbRTi4/hqdefault.jpg" alt="Biryani" />
        <div class="video-info">
          <h4>Chicken Biryani | Ape Amma</h4>
          <p>Ape Amma • LKR 400.00</p>
        </div>
      </div>

      <div class="video-card">
        <img src="https://img.youtube.com/vi/2IJSjvKeZdg/hqdefault.jpg" alt="Curry" />
        <div class="video-info">
          <h4>Butter Chicken Curry | MR Kitchen</h4>
          <p>MR Kitchen • LKR 350.00</p>
        </div>
      </div>

      <!-- Add more video cards here -->
    </section>
  </main>

  <script src="home.js"></script>
</body>
</html>
