<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You Cook Delivers</title>
  <link rel="stylesheet" href="../YCD/css/home.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="../YCD/images/logo3.png" alt="You Cook Logo"/>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search channel or food item" />
      <button class="clear">
        <img src="../YCD/images/close.png" alt="Clear" />
      </button>
      <button class="search-btn">
        <img src="../YCD/images/search.png" alt="Search" />
      </button>
    </div>
    <div class="signup">
      <button><img src="../YCD/images/user.png" alt="User Icon" /> Sign up</button>
    </div>
  </header>

  <main>
    <section class="video-grid">
      <!-- Example Video Card -->
      <div class="video-card">
        <img src="https://img.youtube.com/vi/7RjYIJVSm-0/hqdefault.jpg" alt="Rolls" />
        <div class="video-info">
          <h4>Ramzan Special Recipes for Iftar| Chinese Potato Kabab Recipe</h4>
          <div class="channel-info">
            <img src="profile1.png" alt="Profile" />
            <span>MR Kitchen • LKR 200.00</span>
          </div>
        </div>
      </div>

      <!-- Repeat with other random video data -->
      <!-- ... -->
    </section>
  </main>

  <script src="../YCD/javascript/home.js"></script>
</body>
</html>
