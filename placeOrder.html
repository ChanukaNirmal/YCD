<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>place order</title>
  <link rel="stylesheet" href="../YCD/css/placeOrder.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="../YCD/images/logo3.png" alt="You Cook Logo"/>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search channel or food item" />
      <button class="clear">
        <img src="../YCD/images/close.png" alt="Clear" />
      </button>
      <button class="search-btn">
        <img src="../YCD/images/search.png" alt="Search" />
      </button>
    </div>
    <div class ="ordercart">
    <div class ="orderBtn">
     <a href="../YCD/orders.html"> <button>Orders</button></a>
      </div>
      <div class ="cart">
         <a href="../YCD/cart.html"><img src="../YCD/images/cart.png" alt="cart" /></a>
      </div>
      </div>
    <div class="profile">
      <button><img src="../YCD/images/user.png" alt="User Icon" /></button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="main-section">
      <div class="left-section">
        <div class="slideshow-container">
          <div class="slide fade">
            <img src="../YCD/images/dish (1).jpg" />
          </div>
          <div class="slide fade">
            <img src="../YCD/images/dish (2).jpg" />
          </div>
          <div class="slide fade">
            <img src="../YCD/images/dish (3).jpg" />
          </div>
          <div class="dots">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
          </div>
        </div>

        <div class="video-details">
          <div class="channel-logo">
            <img src="../YCD/images/MR.png" alt="Channel Logo" />
          </div>
          <div class="video-info">
            <h2>Ramzan Special Recipes for Iftar | Chinese Potato Kabab Recipe (Recipe title)</h2>
            <p>Channel Name</p>
            <p>Preparation Time: 120 mins</p>
            <p>Price: <span id="itemPrice">560</span> LKR</p>
            <p>Delivery Time: 20 mins</p>
            <p>Delivery Areas: Colombo</p>
          </div>
        </div>
      </div>

      <div class="right-section">
        <form class="order-form">
          <label>Customer Name</label>
          <input type="text" value="Chanuka Senevirathna" disabled />

          <label>Delivery Address</label>
          <input type="text" value="No.34, Imbulana, Ruwanwella" disabled />

          <label>Quantity</label>
          <select id="quantity" onchange="calculateTotal()">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>

          <label>Payment Method</label>
          <input type="text" value="Cash on Delivery" disabled />

          <div class="price-summary">
            <p>Delivery Fee <span>LRK 280.00</span></p>
            <p>Food item Fee <span id="foodItemFee">LRK 560.00</span></p>
            <p><strong>Food item Fee</strong> <strong id="totalFee">LRK 840.00</strong></p>
          </div>

          <div class="form-buttons">
            <button type="button" class="my-orders-btn">My Orders</button>
            <button type="submit" class="place-order-btn">Place Order</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    let slideIndex = 1;
    showSlide(slideIndex);

    function showSlide(n) {
      let slides = document.getElementsByClassName("slide");
      let dots = document.getElementsByClassName("dot");

      if (n > slides.length) slideIndex = 1;
      if (n < 1) slideIndex = slides.length;

      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }

      for (let i = 0; i < dots.length; i++) {
        dots[i].classList.remove("active");
      }

      slides[slideIndex - 1].style.display = "block";
      dots[slideIndex - 1].classList.add("active");
    }

    function currentSlide(n) {
      slideIndex = n;
      showSlide(slideIndex);
    }

    function calculateTotal() {
      const price = parseFloat(document.getElementById("itemPrice").textContent);
      const qty = parseInt(document.getElementById("quantity").value);
      const deliveryFee = 280;
      const totalItemFee = price * qty;

      document.getElementById("foodItemFee").textContent = `LRK ${totalItemFee.toFixed(2)}`;
      document.getElementById("totalFee").textContent = `LRK ${(totalItemFee + deliveryFee).toFixed(2)}`;
    }

    calculateTotal(); // Initialize on load
  </script>
</body>
</html>
