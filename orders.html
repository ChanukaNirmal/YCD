<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders</title>
  <link rel="stylesheet" href="../YCD/css/orders.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <img src="../YCD/images/logo3.png" alt="You Cook Logo"/>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Search channel or food item" />
      <button class="clear">
        <img src="../YCD/images/close.png" alt="Clear" />
      </button>
      <button class="search-btn">
        <img src="../YCD/images/search.png" alt="Search" />
      </button>
    </div>
   <div class ="ordercart">
    <div class ="orderBtn">
     <a href="../YCD/orders.html"> <button>Orders</button></a>
      </div>
      <div class ="cart">
         <a href="../YCD/cart.html"><img src="../YCD/images/cart.png" alt="cart" /></a>
      </div>
      </div>
    <div class="profile">
      <button><img src="../YCD/images/user.png" alt="User Icon" /></button>
    </div>
  </header>

   <!-- Orders Section -->
  <main class="orders-section">
    <div class="order-card" data-status="pending">
      <img src="../YCD/images/dish (1).jpg" alt="Crab Curry">
      <div class="details">
        <p><strong>Ramzan Special Recipes for Iftar | Chinese Potato Kabab Recipe</strong></p>
        <p>Quantity: 1</p>
        <p>Price: LKR 320.00</p>
        <div class="status">
          <span class="badge pending">Pending</span>
          <button class="cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <div class="order-card" data-status="completed">
      <img src="../YCD/images/dish (2).jpg" alt="Chicken Curry">
      <div class="details">
        <p><strong>Ramzan Special Recipes for Iftar | Chinese Potato Kabab Recipe</strong></p>
        <p>Quantity: 1</p>
        <p>Price: LKR 320.00</p>
        <div class="status">
          <span class="badge delivered">Delivered</span>
          <span class="badge completed">Completed</span>
        </div>
        <div class="review-section">
          <p>Rate this food:</p>
          <div class="stars">★★★★★</div>
          <textarea placeholder="Leave a Review..."></textarea>
          <button class="submit-review">Submit Review</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-box">
      <p>Are you sure you want to cancel this order?</p>
      <button id="confirm-cancel">Yes</button>
      <button id="close-popup">No</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.cancel-btn').forEach(button => {
  button.addEventListener('click', () => {
    const orderCard = button.closest('.order-card');
    document.getElementById('popup').classList.remove('hidden');

    document.getElementById('confirm-cancel').onclick = () => {
      orderCard.remove();
      document.getElementById('popup').classList.add('hidden');
    };

    document.getElementById('close-popup').onclick = () => {
      document.getElementById('popup').classList.add('hidden');
    };
  });
});

  </script>
</body>
</html>
