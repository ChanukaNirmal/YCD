<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Requests</title>
    <link rel="stylesheet" href="../YCD/css/recipeRequest.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Order Requests</h1>
            <div class="logo">
                <img src="../YCD/images/logo.png" alt="Logo">
            </div>
        </header>
        <hr width="100%" size="1" color="gray">
        <br><br>
        <div class="filter-section">
            <label>Filter by Status:</label>
            <div class="dropdown">
                <button class="dropdown-btn">ALL ▼</button>
                <div class="dropdown-content">
                    <a href="#" data-status="ALL">ALL</a>
                    <a href="#" data-status="PENDING">PENDING</a>
                    <a href="#" data-status="PREPARING">PREPARING</a>
                    <a href="#" data-status="DISPATCHED">DISPATCHED</a>
                    
                </div>
            </div>
        </div>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Address</th>
                    <th>Recipe</th>
                    <th>Quantity</th>
                    <th>Price(LKR)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>0001</td>
                    <td>Jhone</td>
                    <td>Colombo</td>
                    <td>Burger</td>
                    <td>1</td>
                    <td>560</td>
                    <td><span class="status pending">Pending</span></td>
                    <td>
                        <button class="action-btn accept">Accept</button>
                        <button class="action-btn reject">Reject</button>
                    </td>
                </tr>
                <tr>
                    <td>0002</td>
                    <td>ravi</td>
                    <td>Kegalle</td>
                    <td>Cake</td>
                    <td>1</td>
                    <td>530</td>
                    <td><span class="status preparing">Preparing</span></td>
                    <td>
                        <button class="action-btn dispatched">Dispatched</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Popup for Reject confirmation -->
    <div id="reject-popup" class="popup" style="display: none;">
        <div class="popup-content">
            <p>Are you sure reject this order?</p>
            <div class="popup-buttons">
                <button id="reject-yes" class="action-btn reject">Yes</button>
                <button id="reject-no" class="action-btn">No</button>
            </div>
        </div>
    </div>

    <script>
    // Dropdown functionality
    const dropdownBtn = document.querySelector('.dropdown-btn');
    const dropdownContent = document.querySelector('.dropdown-content');
    const dropdownItems = document.querySelectorAll('.dropdown-content a');
    const ordersTable = document.getElementById('orders-table');

    dropdownBtn.addEventListener('click', () => {
        dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
    });

    dropdownItems.forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            const selectedStatus = item.getAttribute('data-status').toUpperCase();
            dropdownBtn.textContent = item.textContent + ' ▼';
            dropdownContent.style.display = 'none';
            filterRowsByStatus(selectedStatus);
        });
    });

    document.addEventListener('click', (e) => {
        if (!dropdownBtn.contains(e.target) && !dropdownContent.contains(e.target)) {
            dropdownContent.style.display = 'none';
        }
    });

    function filterRowsByStatus(status) {
        const rows = ordersTable.querySelectorAll('tbody tr');
        rows.forEach(row => {
            const statusText = row.querySelector('.status')?.textContent?.toUpperCase();
            if (status === 'ALL' || statusText === status) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // Handle button actions with event delegation
    ordersTable.addEventListener('click', (e) => {
        const target = e.target;
        if (!target.classList.contains('action-btn')) return;

        const row = target.closest('tr');
        const statusCell = row.querySelector('.status');
        const actionCell = row.querySelector('td:last-child');

        if (target.classList.contains('accept')) {
            statusCell.textContent = 'Preparing';
            statusCell.className = 'status preparing';
            actionCell.innerHTML = '<button class="action-btn dispatched">Dispatched</button>';
        } else if (target.classList.contains('dispatched')) {
            statusCell.textContent = 'Dispatched';
            statusCell.className = 'status dispatched';
            actionCell.innerHTML = '<span>Completed</span>';
        } else if (target.classList.contains('reject') && !target.id) {
            const popup = document.getElementById('reject-popup');
            popup.style.display = 'flex';

            const yesBtn = document.getElementById('reject-yes');
            const noBtn = document.getElementById('reject-no');

            const newYesBtn = yesBtn.cloneNode(true);
            const newNoBtn = noBtn.cloneNode(true);
            yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
            noBtn.parentNode.replaceChild(newNoBtn, noBtn);

            newYesBtn.onclick = () => {
                row.remove();
                popup.style.display = 'none';
            };

            newNoBtn.onclick = () => {
                popup.style.display = 'none';
            };
        }
    });
</script>

</body>
</html>
