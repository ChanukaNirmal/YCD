<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business & Cooking Info</title>
  <link rel="stylesheet" href="../YCD/css/cookInfo.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Business & Cooking Information</h1>
      <div class="logo">
        <img src="../YCD/images/logo.png" alt="Logo">
      </div>
    </header>

    <form>
      <div class="form-group">
        <label for="cuisine">Cuisine Type</label>
        <input type="text" id="cuisine" placeholder="What kind of food they make (e.g., Italian, Indian, Fast Food)" />
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="Where they cook from (important for delivery)" />
      </div>

      <div class="form-group">
        <label for="price">Price Range</label>
        <div class="price-range">
          <input type="text" placeholder="Min" />
          <input type="text" placeholder="Max" />
        </div>
      </div>

      <div class="terms">
        <strong>Terms & Agreement</strong>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="terms" />
            Agree to Terms & Conditions <a href="#">Read more</a>
            
          </label>
          <br>

          <label>
            <input type="checkbox" id="safety" />
            Agree to Food Safety Guidelines <a href="#">Read more</a>
          </label>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" class="signup" id="signupBtn" disabled>Sign up</button>
        <button type="reset" class="reset">Reset</button>
      </div>

      <p class="sign-in">
        You already have an account please <a href="#">Sign in</a>
      </p>
    </form>
  </div>

  <!-- JavaScript for checkbox validation -->
  <script>
    const termsCheckbox = document.getElementById('terms');
    const safetyCheckbox = document.getElementById('safety');
    const signupBtn = document.getElementById('signupBtn');

    function toggleSignupButton() {
      signupBtn.disabled = !(termsCheckbox.checked && safetyCheckbox.checked);
    }

    termsCheckbox.addEventListener('change', toggleSignupButton);
    safetyCheckbox.addEventListener('change', toggleSignupButton);
  </script>

</body>
</html>
