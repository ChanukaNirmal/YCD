<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Delivery Rider</title>
  <link rel="stylesheet" href="../YCD/css/findRider.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="title-section">
        <h1>Find a Delivery Rider</h1>
        
        <p>Select a rider to deliver your food orders.</p>
      </div>
      <div class="order-id">Order ID : 0001</div>
      <div class="logo"> <img src="../YCD/images/logo.png" alt="Logo"></div>
    </header>
    <hr />
    <div class="filter-section">
      <label for="location">Filter by Location:</label>
      <select id="location">
        <option selected>Colombo</option>
        <option>All Locations</option>
        <option>Colombo</option>
        <option>Gampaha</option>
        <option>Kaluthara</option>
        <option>Kegalle</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Rider ID</th>
          <th>Rider Name</th>
          <th>Location</th>
          <th>Rating</th>
          <th>Contact</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>R0001</td>
          <td>Michael Smith</td>
          <td>Colombo</td>
          <td class="stars">⭐⭐⭐⭐⭐</td>
          <td>+123456789</td>
          <td><button class="connect-btn">Connect</button></td>
        </tr>
        <tr>
          <td>R0002</td>
          <td>Sanath Perera</td>
          <td>Negambo</td>
          <td class="stars">⭐⭐⭐⭐</td>
          <td>+122356789</td>
          <td><button class="connect-btn">Connect</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
